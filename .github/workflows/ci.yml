name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        backend: [file, sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: izin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IZIN_TEST_BACKEND: ${{ matrix.backend }}
      IZIN_TEST_PG_URL: postgresql://postgres:test@localhost:5432/izin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Dosya sürüm işaretleri (kesik / eski dosya kontrolü)
        run: |
          python - <<'PY'
          import re, pathlib, sys
          exp = re.search(r"_EXPECTED = \[(.*?)\]", pathlib.Path("app.py").read_text(encoding="utf-8"), re.S).group(1)
          ver = re.search(r'VERSION = "([^"]+)"', pathlib.Path("app.py").read_text(encoding="utf-8")).group(1)
          bad = [f for f in re.findall(r'"([^"]+\.py)"', exp) if not pathlib.Path(f).read_text(encoding="utf-8").rstrip().endswith(f"# END-OF-FILE v{ver}")]
          print("işaretsiz dosyalar:", bad)
          sys.exit(1 if bad else 0)
          PY
      - run: python -m pytest -q
